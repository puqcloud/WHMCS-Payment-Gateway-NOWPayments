<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161c33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0be0c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0be0c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Central Crypto Payment Emblem -->
  <g transform="translate(175, 45) scale(1.9)">
    <!-- Outer Shield / Circle Glow -->
    <circle cx="40" cy="40" r="36" fill="#0be0c7" opacity="0.08" stroke="#0be0c7" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Primary Crypto Coin -->
    <circle cx="40" cy="40" r="28" fill="url(#coinGrad)" opacity="0.25" stroke="#0be0c7" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Crypto Symbol -->
    <path d="M37,28 L37,52 M41,28 L41,52 M33,32 L42,32 C46,32 48,34 48,36 C48,39 46,40 42,40 M33,40 L44,40 C48,40 50,42 50,45 C50,49 47,50 42,50 L33,50 M37,25 L37,28 M41,25 L41,28 M37,52 L37,55 M41,52 L41,55" 
          fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Secondary Node -->
    <circle cx="70" cy="20" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="70" cy="62" r="8" fill="#10b981"/>
    <polyline points="66,62 69,65 74,59" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Module Name (Edge to Edge, High Impact) -->
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">NOWPAYMENTS</text>
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">GATEWAY</text>

  <!-- Subtitle -->
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WHMCS PAYMENT GATEWAY</text>

  <!-- Separator -->
  <rect x="150" y="405" width="200" height="4" fill="#0be0c7" rx="2"/>

  <!-- PUQ Software Branding -->
  <g transform="translate(150, 435)">
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0be0c7">PUQ</text>
    <text x="92" y="28" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Software</text>
  </g>
</svg>
